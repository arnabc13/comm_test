<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Accenture Comms Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centred exam console (820px) under a slim sticky status bar; the report widens to 1000px with paired panels.
   Palette: cool exam-room greys, a deep teal for "system/listening", signal red reserved for "recording". */
:root{
 --bg:#EDF1F2;--surface:#FFFFFF;--surface-2:#F5F8F8;--ink:#121A1E;--muted:#55636B;--line:#D5DEE1;
 --accent:#0B6B67;--accent-ink:#FFFFFF;--accent-soft:#D8EEEC;
 --rec:#C93A2B;--rec-soft:#FBE3DF;
 --good:#257A48;--good-soft:#DFF1E5;--warn:#9A5E0C;--warn-soft:#FAEDD6;--bad:#B3302A;--bad-soft:#F8E0DE;--info:#2D5AA0;--info-soft:#E0E8F6;
 --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
 --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
 --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
 --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1416;--surface:#161E21;--surface-2:#1B2528;--ink:#E6EDEF;--muted:#9BA9B0;--line:#2B373B;
 --accent:#4DB6AF;--accent-ink:#06201F;--accent-soft:#143634;--rec:#FF6F5E;--rec-soft:#3A1D19;
 --good:#5FCB8A;--good-soft:#163024;--warn:#E7AB55;--warn-soft:#352711;--bad:#FF7D73;--bad-soft:#3A1C1A;--info:#86ABEC;--info-soft:#1B2740;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0E1416;--surface:#161E21;--surface-2:#1B2528;--ink:#E6EDEF;--muted:#9BA9B0;--line:#2B373B;
 --accent:#4DB6AF;--accent-ink:#06201F;--accent-soft:#143634;--rec:#FF6F5E;--rec-soft:#3A1D19;
 --good:#5FCB8A;--good-soft:#163024;--warn:#E7AB55;--warn-soft:#352711;--bad:#FF7D73;--bad-soft:#3A1C1A;--info:#86ABEC;--info-soft:#1B2740;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(30px,5.4vw,44px);line-height:1.05}
h2{font-size:clamp(23px,3.8vw,30px);line-height:1.12}
h3{font-size:18px;line-height:1.25}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;word-break:break-all}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:64ch;font-size:16px}
.small{font-size:13.5px}.tiny{font-size:12px}.muted{color:var(--muted)}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
.lbl{display:block;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 11px var(--f-mono)}
.prog{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.chip{font:600 11px/1 var(--f-mono);padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
.chip.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.done{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.confirm{background:var(--warn-soft);border-bottom:1px solid var(--line)}
.confirm .topbar-in{justify-content:space-between}

/* page */
.wrap{max-width:820px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.wrap.wide{max-width:1000px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.grid2.tight{gap:16px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta-row.center{justify-content:center}
.btn{font:600 14.5px/1 var(--f-body);padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.big{padding:15px 22px;font-size:15.5px}
.btn.small-btn{min-height:38px;padding:9px 13px;font-size:13.5px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.drill:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.warn-box{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink);padding:14px 16px;border-radius:8px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.warn-box ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* home */
.home-hero{display:flex;flex-direction:column;gap:14px;padding-block:8px 6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{color:var(--accent);font-weight:700;width:28px}
tr.sep td{border-top:2px solid var(--line)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
select,input[type=text]{font:500 14px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);width:100%;min-height:42px}
.drill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.drill{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;color:var(--ink);font:inherit}
.drill:hover{border-color:var(--accent)}
.dk{grid-row:1/3;width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:16px}
.dn{font-weight:700;font-family:var(--f-display);font-size:16px}
.dc{font-size:13px;color:var(--muted)}
.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.step{position:relative}
.stepn{position:absolute;top:16px;right:18px;color:var(--muted);font-size:13px}
.mic-out{font-size:14px;min-height:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec-dot,.status .dot{width:9px;height:9px;border-radius:50%;background:var(--rec);display:inline-block}
.rec-dot{animation:blink 1s infinite}

/* section intro */
.intro{gap:14px}
.example{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:14px 16px;font-size:14.5px}
.example p{line-height:1.65}
.facts{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.facts li{font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:6px 10px;border-radius:6px}

/* exam console */
.console{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.console-head,.console-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:var(--surface-2);flex-wrap:wrap}
.console-head{border-bottom:1px solid var(--line)}
.console-foot{border-top:1px solid var(--line);min-height:58px}
.count{font-size:12.5px;color:var(--muted)}
.console-body{padding:40px 20px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:380px}
.ring{position:relative;width:136px;height:136px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--accent);transition:stroke .2s}
.console.rec .ring .val{stroke:var(--rec)}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--f-mono);font-variant-numeric:tabular-nums}
.status{font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.status .dot{background:currentColor}
.console.listen .status{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.console.rec .status{background:var(--rec-soft);color:var(--rec);border-color:transparent}
.console.rec .status .dot{animation:blink 1s infinite}
.console.rec .status.heard::after{content:"voice detected";font-weight:500;opacity:.75;text-transform:none;letter-spacing:0}
.ptext{font-family:var(--f-display);font-weight:500;font-size:clamp(21px,3.6vw,28px);line-height:1.35;max-width:32ch;text-wrap:balance}
.ptext.topic{font-weight:700}
.wave{display:flex;gap:5px;height:36px;align-items:center}
.wave i{width:5px;height:30%;border-radius:3px;background:var(--accent);animation:wv 1.1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}.wave i:nth-child(6){animation-delay:.6s}.wave i:nth-child(7){animation-delay:.72s}
.typebox{width:100%;max-width:580px;min-height:110px;font:500 16px/1.5 var(--f-body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);resize:vertical}
.live{font-size:13px;color:var(--muted);max-width:60ch;min-height:20px}
@keyframes wv{0%,100%{height:22%}50%{height:100%}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
.center-panel{align-items:center;text-align:center;padding-block:48px;gap:14px}
.center-panel .lede{margin:0 auto}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}

/* email */
.email-ws{display:flex;flex-direction:column;gap:16px}
.email-brief p{font-size:15px}
.eb-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-size:22px;font-weight:700}
.timer.low{color:var(--rec)}
.email-form{gap:0;padding:0;overflow:hidden}
.ef-row{display:grid;grid-template-columns:80px 1fr;align-items:center;border-bottom:1px solid var(--line);padding:4px 14px;gap:8px}
.ef-row span{font:600 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ef-row input{border:0;background:transparent;padding:10px 4px;min-height:44px}
.email-form textarea{border:0;min-height:300px;padding:16px 18px;font:400 15.5px/1.6 var(--f-body);background:transparent;color:var(--ink);resize:vertical;width:100%}
.ef-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2)}

/* report */
.rep-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.rep-head>div:first-child{display:flex;flex-direction:column;gap:8px}
.score-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.score-card{gap:8px}
.big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.03em}
.big small{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;justify-content:center;font:700 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;align-self:flex-start}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.ok{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.ai-card{background:var(--surface-2)}
.prio{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.prio li span{display:block;color:var(--muted);font-size:14.5px}
.params{display:flex;flex-direction:column;gap:10px}
.prm{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(70px,1fr) 34px;gap:12px;align-items:center;font-size:14px}
.prm b{text-align:right}
.k{color:var(--accent);font-weight:700}
.meter{height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--muted)}
.meter i.good{background:var(--good)}.meter i.ok{background:var(--warn)}.meter i.bad{background:var(--bad)}
.details{display:flex;flex-direction:column;gap:12px}
.sec-d{padding:0;gap:0}
.sec-d summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px}
.sec-d summary::-webkit-details-marker{display:none}
.sec-d summary::after{content:"+";margin-left:8px;font:500 20px var(--f-mono);color:var(--muted)}
.sec-d[open] summary::after{content:"–"}
.sec-d summary .sn{font-family:var(--f-display);font-weight:700;font-size:17px;flex:1}
.sec-d summary .pill{align-self:center}
.sec-d>*:not(summary){margin:0 20px 16px}
.tips{background:var(--accent-soft);border-radius:8px;padding:14px 16px}
.tips ul,.tips ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.passage{border-left:3px solid var(--line);padding:4px 0 4px 14px;font-size:14px;color:var(--muted)}
.qrow{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.qrow.v-bad{border-left:4px solid var(--bad)}.qrow.v-ok{border-left:4px solid var(--warn)}.qrow.v-good{border-left:4px solid var(--good)}
.qtop{display:flex;gap:10px;align-items:flex-start}
.qnum{font-size:12px;color:var(--muted);padding-top:2px;min-width:26px}
.qp{flex:1;font-weight:600;font-size:14.5px;min-width:0}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.qgrid.one{grid-template-columns:1fr}
.qgrid p{font-size:14.5px}
.said{line-height:1.9}
.w{padding:1px 2px;border-radius:3px}
.w.miss{color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.w.xtra{color:var(--info);background:var(--info-soft);text-decoration:underline dotted}
.w.nr{color:var(--warn);background:var(--warn-soft)}
.notes{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.notes.good{color:var(--good)}
.legend{display:flex;gap:8px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.metrics div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.metrics b{font-size:20px}
.metrics span{font-size:12px;color:var(--muted)}
.email-rep{display:flex;flex-direction:column;gap:16px}
.crit{background:var(--bad-soft);color:var(--ink);border-radius:8px;padding:12px 16px;font-size:14px}
.crit ul{margin:6px 0 0;padding-left:18px}
.checks{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.checks li::before{font-family:var(--f-mono);font-weight:700;margin-right:8px}
.checks li.y::before{content:"✓";color:var(--good)}
.checks li.n::before{content:"✗";color:var(--bad)}
.mail{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface-2);font-size:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mail.model{border-style:dashed}
.mail pre{white-space:pre-wrap;word-break:break-word;font:400 14px/1.55 var(--f-body);margin:6px 0 0}
details.sub summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
details.sub p{font-size:14px;margin-top:6px}
.prompt-box{width:100%;min-height:220px;font:400 13px/1.5 var(--f-mono);padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.ai-panel{gap:16px}
.ai-block{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.ai-q{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.fix-t td,.fix-t th{font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;font-size:14px;max-width:min(92vw,520px);z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tapbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--rec-soft);border-top:2px solid var(--rec);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.miclog{font:12px/1.5 var(--f-mono);white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;margin:8px 0 0}
.tap-ans{width:100%;max-width:420px;min-height:64px;font-size:18px}
.badge{font:600 11px var(--f-mono);background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:5px;margin-left:8px}
@media (max-width:560px){.console-body{padding:28px 14px;min-height:320px}.big{font-size:46px}.prm{grid-template-columns:1fr 60px 30px}.ef-row{grid-template-columns:64px 1fr}}
@media (prefers-reduced-motion:reduce){.wave i,.rec-dot,.console.rec .status .dot,.spinner{animation:none}.wave i{height:60%}}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
 <div class="brand"><span class="brand-mark">AC</span>Comms Mock</div>
 <nav class="prog" id="prog" aria-label="Section progress"></nav>

{id:"e1",to:"rahul.verma@example.com",title:"Delayed laptop delivery",scenario:"You work in the customer support team at ShopEasy, an online electronics store. A customer, Mr. Rahul Verma (rahul.verma@example.com), ordered a laptop on 10 October. It was promised within five days but has not arrived, and he has written an angry email. Reply to him: apologize, explain that the delay was caused by a problem at the warehouse, confirm the laptop will be delivered within two days, and offer him a 10% discount coupon on his next purchase.",

 points:[{label:"Sneha's farewell",any:["sneha"]},{label:"Friday at 1 PM",any:["friday"]},{label:"Green Leaf Restaurant",any:["green leaf"]},{label:"500 rupees for the gift",any:["five hundred","contribut","500"]},{label:"Deadline: Wednesday",any:["wednesday"]}],
 model:"Dear Team,\n\nAs you know, our colleague Sneha is leaving the company after six wonderful years with us. To thank her, we are organizing a farewell lunch on Friday at 1 PM at Green Leaf Restaurant.\n\nWe are also planning to buy a gift for her. Please contribute 500 rupees by Wednesday so that we can arrange the gift in time.\n\nPlease reply to confirm your attendance. I hope to see all of you there.\n\nRegards,\n[Your Name]"},
{id:"e6",to:"arjun.mehta@example.com",title:"Refund processed",scenario:"You work in customer support at FootFirst, an online shoe store. A customer, Mr. Arjun Mehta (arjun.mehta@example.com), returned a pair of shoes. Write to tell him that his refund of Rs. 2,499 has been processed and that the amount will reach his original payment method within 5 to 7 working days.",
 subjectKeys:["refund","return","processed"],subjectExample:"Your refund has been processed",
 points:[{label:"Refund processed",any:["refund"]},{label:"Amount: Rs. 2,499",any:["2499","2,499","amount"]},{label:"5 to 7 working days",any:["working days","business days","seven","five"]},{label:"Original payment method",any:["original","payment method","same account","account","card"]}],
 model:"Dear Mr. Mehta,\n\nThank you for returning the shoes. I am writing to inform you that your refund of Rs. 2,499 has been processed successfully.\n\nThe amount will be credited to your original payment method within 5 to 7 working days. If you do not receive it within this time, please contact us and we will look into it immediately.\n\nThank you for shopping with us.\n\nBest regards,\n[Your Name]\nCustomer Support, FootFirst"},
{id:"e7",to:"kavya.rao@example.com",title:"Double-charged customer",scenario:"You work in the billing team of an internet provider. A customer, Ms. Kavya Rao (kavya.rao@example.com), was charged twice for her monthly plan of Rs. 799. Write to her: confirm that you checked her account and found the double charge, apologize, and tell her the extra amount will be refunded within three working days.",
 subjectKeys:["refund","charge","bill","duplicate","double"],subjectExample:"Refund for the duplicate charge on your bill",
 points:[{label:"Confirm the double charge",any:["twice","double","two times","duplicate","extra"]},{label:"Apologize",any:["sorry","apolog","regret"]},{label:"Refund of the extra amount",any:["refund","return","credit","revers"]},{label:"Within three working days",any:["three","working days"]}],
 model:"Dear Ms. Rao,\n\nThank you for bringing this to our attention. I have checked your account and confirmed that you were charged twice for your monthly plan of Rs. 799. I sincerely apologize for this error.\n\nThe extra amount will be refunded to your account within three working days. We have also taken steps to make sure this does not happen again.\n\nPlease feel free to contact me if you have any other questions.\n\nKind regards,\n[Your Name]\nBilling Support Team"},
{id:"e8",to:"laura.chen@example.com",title:"Thank-you after an interview",scenario:"Yesterday you were interviewed for the Associate Software Engineer role. Write a thank-you email to the HR manager, Ms. Laura Chen (laura.chen@example.com). Thank her, show your interest in the role, and ask about the next steps.",
 subjectKeys:["thank","interview","associate","software"],subjectExample:"Thank you for the interview: Associate Software Engineer",
 points:[{label:"Thank her for the interview",any:["thank"]},{label:"Name the role",any:["associate","software engineer","position","role"]},{label:"Show interest",any:["interest","excited","eager","look forward","keen","enthusias"]},{label:"Ask about next steps",any:["next step","update","hear from you","process","further"]}],
 model:"Dear Ms. Chen,\n\nThank you for taking the time to interview me yesterday for the Associate Software Engineer position. I enjoyed learning more about the team and the projects you are working on.\n\nOur discussion made me even more excited about this role. I believe my programming skills and my ability to work in a team will help me contribute from the first day.\n\nI look forward to hearing from you about the next steps in the process.\n\nBest regards,\n[Your Name]"},
{id:"e9",to:"it.helpdesk@example.com",title:"Laptop problem to IT support",scenario:"Since yesterday's software update, your office laptop restarts automatically several times a day. You have an important client presentation tomorrow. Write to the IT helpdesk (it.helpdesk@example.com) describing the problem and requesting urgent help.",
 subjectKeys:["laptop","restart","urgent","issue","problem","update"],subjectExample:"Urgent: Laptop restarting repeatedly after update",
 points:[{label:"Describe the problem: restarts",any:["restart","shut","reboot","switch off","turns off"]},{label:"Started after the update",any:["update"]},{label:"Urgency: presentation tomorrow",any:["tomorrow","presentation","urgent"]},{label:"Request help",any:["request","help","assist","check","look into","fix","support","resolve"]}],
 model:"Dear IT Support Team,\n\nSince yesterday's software update, my laptop has been restarting automatically several times a day, and I lose my unsaved work each time.\n\nI have an important client presentation tomorrow, so this issue is urgent. Could you please check my laptop and fix the problem as soon as possible?\n\nI am available at my desk all day, and you can reach me at any time.\n\nThank you for your help.\n\nRegards,\n[Your Name]"},
{id:"e10",to:"all.customers@example.com",title:"Scheduled maintenance notice",scenario:"You work for a bank. Write an email to customers (all.customers@example.com) informing them that the mobile banking app will be unavailable from Saturday 11 PM to Sunday 3 AM for scheduled maintenance. Apologize for the inconvenience and tell them to call the 24-hour helpline, 1800-123-4567, for urgent help.",
 subjectKeys:["maintenance","unavailable","downtime","app","service"],subjectExample:"Scheduled maintenance: app unavailable Saturday 11 PM to Sunday 3 AM",
 points:[{label:"App unavailable for maintenance",any:["maintenance","upgrade"]},{label:"Saturday 11 PM to Sunday 3 AM",any:["saturday","sunday"]},{label:"Apologize for inconvenience",any:["sorry","apolog","inconvenience","regret"]},{label:"24-hour helpline",any:["helpline","customer care","1800"]}],
 model:"Dear Customer,\n\nWe would like to inform you that our mobile banking app will be unavailable from Saturday 11 PM to Sunday 3 AM due to scheduled maintenance. This upgrade will help us serve you better.\n\nWe apologize for any inconvenience this may cause. If you need urgent help during this time, please call our 24-hour helpline at 1800-123-4567.\n\nThank you for your patience and understanding.\n\nWarm regards,\nCustomer Service Team"},
{id:"e11",to:"facilities@example.com",title:"Complaint to facilities",scenario:"The air conditioner on the fourth floor of your office has not been working for three days. The room is very hot and it is affecting everyone's work. Write to the facilities team (facilities@example.com) reporting the problem and asking them to repair it by tomorrow.",
 subjectKeys:["air condition","ac","cooling","repair","fourth","not working"],subjectExample:"Air conditioner not working on the fourth floor",
 points:[{label:"AC not working",any:["air condition","ac","cooling"]},{label:"Location: fourth floor",any:["fourth"]},{label:"For three days",any:["three days","three"]},{label:"Impact on work",any:["hot","work","productiv","uncomfortable","concentrat"]},{label:"Repair by tomorrow",any:["repair","fix","resolve","technician","look into","tomorrow"]}],
 model:"Dear Facilities Team,\n\nI would like to report that the air conditioner on the fourth floor has not been working for the last three days. The room has become very hot, and it is affecting our work and concentration.\n\nCould you please send a technician to repair it by tomorrow? Please let me know if you need any more information.\n\nThank you for your support.\n\nRegards,\n[Your Name]"},
{id:"e12",to:"neil.thomas@example.com",title:"Subscription cancellation",scenario:"A customer, Mr. Neil Thomas (neil.thomas@example.com), has asked to cancel his StreamPlus subscription. Write to confirm the cancellation, explain that he can use the service until the end of his current billing cycle on 30 November, tell him he will not be charged again, and politely ask for feedback.",
 subjectKeys:["cancel","subscription","streamplus","confirm"],subjectExample:"Confirmation of your StreamPlus subscription cancellation",
 points:[{label:"Confirm cancellation",any:["cancel"]},{label:"Access until 30 November",any:["november","billing cycle"]},{label:"No further charges",any:["no further","not be charged","no more","no additional","will not charge","charged again","not charge"]},{label:"Ask for feedback",any:["feedback","reason","improve","survey","suggestion"]}],
 model:"Dear Mr. Thomas,\n\nThank you for your request. I confirm that your StreamPlus subscription has been cancelled. You can continue to use the service until the end of your current billing cycle on 30 November.\n\nYou will not be charged again after this date.\n\nWe are sorry to see you go. We would be grateful if you could share the reason for cancelling, as your feedback will help us improve.\n\nBest regards,\n[Your Name]\nCustomer Support"},
{id:"e13",to:"sarah.johnson@example.com",title:"Missed deadline apology",scenario:"You promised to deliver a website design draft to your client, Ms. Sarah Johnson (sarah.johnson@example.com), on Monday, but you could not because a team member was unwell. Write to her: apologize, explain the reason, give Thursday as the new delivery date, and explain what you will do to avoid this in future.",
 subjectKeys:["delay","apolog","draft","design","website","deadline"],subjectExample:"Apology for the delay in the website design draft",
 points:[{label:"Apologize",any:["sorry","apolog","regret"]},{label:"Reason: team member unwell",any:["unwell","ill","sick","health"]},{label:"New date: Thursday",any:["thursday"]},{label:"Prevention steps",any:["ensure","prevent","avoid","future","again","backup","extra"]}],
 model:"Dear Ms. Johnson,\n\nI sincerely apologize that we could not deliver the website design draft on Monday as promised. One of our team members was unwell, which delayed our work.\n\nI am pleased to confirm that you will receive the draft by Thursday. To make sure this does not happen again, we have added a backup designer to the project.\n\nThank you for your patience and understanding.\n\nBest regards,\n[Your Name]"},
{id:"e14",to:"vikram.singh@example.com",title:"Status update request",scenario:"You are a project lead. Write to your team member, Mr. Vikram Singh (vikram.singh@example.com), asking for a status update on the testing module before Friday's client review. Ask which parts are complete, which issues are pending, and whether he needs any support. Ask him to reply by end of day Wednesday.",
 subjectKeys:["status","update","testing","progress"],subjectExample:"Status update needed: testing module",
 points:[{label:"Ask for status of testing module",any:["status","update","progress"]},{label:"Friday client review",any:["friday","client review"]},{label:"Completed and pending items",any:["complete","pending","remaining"]},{label:"Offer support / blockers",any:["support","blocker","help","issue","challenge"]},{label:"Reply by Wednesday",any:["wednesday"]}],
 model:"Dear Vikram,\n\nI hope you are doing well. We have a client review on Friday, and I need an update on the testing module before then.\n\nCould you please share which parts are completed, which issues are still pending, and whether you need any support from me?\n\nPlease send me the update by the end of the day on Wednesday.\n\nThank you.\n\nBest regards,\n[Your Name]"},
{id:"e15",to:"meera.iyer@example.com",title:"Customer cannot log in",scenario:"A customer, Ms. Meera Iyer (meera.iyer@example.com), cannot log in to her account after changing her phone number. Reply with steps: click Forgot Password on the login page, enter her registered email address, and follow the reset link. Also tell her to update her new mobile number in her profile, and offer further help.",
 subjectKeys:["log","account","password","access","reset"],subjectExample:"Steps to log in to your account",
 points:[{label:"Click Forgot Password",any:["forgot password","forgot","reset"]},{label:"Enter registered email / follow link",any:["registered","link","email address"]},{label:"Update mobile number in profile",any:["profile","mobile number","phone number"]},{label:"Offer further help",any:["further","assist","help","contact","reach out","support"]}],
 model:"Dear Ms. Iyer,\n\nThank you for contacting us. I am sorry to hear that you cannot log in after changing your phone number.\n\nPlease click Forgot Password on the login page and enter your registered email address. You will receive a link to reset your password. After you log in, please update your new mobile number in your profile.\n\nIf you need any further help, feel free to reply to this email.\n\nKind regards,\n[Your Name]\nCustomer Support"}
];

{id:"p17",story:"A small business ordered new packaging materials for an important product launch. The delivery was delayed because of severe weather. The owner contacted the supplier, explained the urgency, and requested an updated delivery estimate. The supplier arranged a faster delivery service, and the materials arrived one day before the launch.",qs:[

{id:"p18",story:"A group of college students noticed that the area around their campus had very little greenery. They organised a weekend planting event and invited residents to participate. Local businesses donated gardening tools, while volunteers prepared the soil and planted young trees. The students planned to check the plants regularly and water them during dry weather.",qs:[
 {q:"What problem did the students notice?",keys:[["green","tree","plant"]],model:"They noticed that there was very little greenery around their campus."},
 {q:"When did they organise the planting event?",keys:[["weekend"]],model:"They organised the planting event on a weekend."},
 {q:"How did local businesses help?",keys:[["tool","donat"]],model:"Local businesses donated gardening tools."},
 {q:"What did the students plan to do afterwards?",keys:[["water","check"]],model:"They planned to check the plants regularly and water them during dry weather."}]},
{id:"p19",story:"Riya was asked to prepare a presentation using software she had never used before. At first, she found the interface confusing. She watched a few tutorials, practised with a sample file, and asked a colleague for feedback. By the end of the week, she had created a clear presentation and felt more confident using the software.",qs:[

 {q:"How did she feel by the end of the week?",keys:[["confident"]],model:"By the end of the week she felt more confident using the software."}]},
{id:"p20",story:"A retail store received repeated feedback that customers had to wait too long at checkout. The manager observed the busiest hours and discovered that too few counters were open during the evening rush. The store changed staff schedules and introduced a separate counter for customers with only a few items. After several weeks, waiting times decreased and customer feedback improved.",qs:[
 {q:"What complaint did the store receive?",keys:[["wait","checkout","long"]],model:"Customers complained that they had to wait too long at checkout."},
 {q:"What did the manager discover?",keys:[["counter","few"]],model:"The manager discovered that too few counters were open during the evening rush."},

 {q:"What happened after several weeks?",keys:[["decreas","reduc","improv","shorter","less"]],model:"After several weeks, waiting times decreased and customer feedback improved."}]},
{id:"p21",story:"A university club planned a career seminar with three guest speakers. Two days before the event, one speaker cancelled due to an emergency. The organisers contacted another professional, updated the schedule, and informed registered participants. The seminar began on time, and the attendees appreciated the practical advice shared by the speakers.",qs:[
 {q:"What event did the club plan?",keys:[["seminar","career"]],model:"The club planned a career seminar with three guest speakers."},
 {q:"What problem happened two days before the event?",keys:[["cancel"]],model:"One of the speakers cancelled because of an emergency."},
 {q:"What did the organisers do?",keys:[["contact","another","update","schedule","inform","replace"]],model:"They contacted another professional, updated the schedule and informed the participants."},
 {q:"How did the seminar go?",keys:[["on time","appreciat","success","well","good"]],model:"The seminar began on time, and the attendees appreciated the practical advice."}]}

{id:"e16",kind:"case",pyq:true,to:"patrick.jones1979@gmail.com",title:"Refund demand — Heven InfoTech (past question)",scenario:"Your name is Mary Taylor. You have recently joined Heven InfoTech Inc. as a customer sales executive (CSE). You receive a refund demand from a customer, Patrick Jones. He purchased a three-month subscription and is very dissatisfied with the speed of updates and with communication with your company. You are behind in many of your client correspondences because technical glitches within your company's hardware have led to increased workloads. However, the delays in communication were also because the customer gave you a wrong address. Send a reply to Patrick Jones (patrick.jones1979@gmail.com) explaining the reasons for the recent delays. Explain also that the company cannot issue refunds for already used services. Also, verify his contact details so that service can be resumed.",
 subjectKeys:["delay","refund","subscription","response","update","service","request"],subjectExample:"Regarding your refund request and recent delays",
 points:[{label:"Apologize for the delays",any:["sorry","apolog","regret"]},{label:"Reason 1: hardware glitches → higher workload",any:["glitch","hardware","technical","workload"]},{label:"Reason 2: the address provided was wrong",any:["wrong address","incorrect address","address"]},{label:"No refund for services already used",any:["refund"]},{label:"Ask him to verify contact details",any:["verify","confirm","contact details","update","correct"]},{label:"Service will resume",any:["resume","restore","continue"]},{label:"Sign off as Mary Taylor, CSE",any:["mary"]}],
 model:"Dear Mr. Jones,\n\nThank you for your email. I sincerely apologize for the delays in our updates and communication.\n\nThere were two reasons for these delays. Technical glitches in our company's hardware increased our workload, which slowed down our responses to clients. In addition, the address we had on record for you was incorrect, so some of our messages did not reach you.\n\nI am sorry, but as per company policy, we cannot issue a refund for services that have already been used.\n\nCould you please verify your current address and contact details? Once you confirm them, we will resume your service immediately.\n\nThank you for your patience.\n\nBest regards,\nMary Taylor\nCustomer Sales Executive\nHeven InfoTech Inc."},
{id:"e17",kind:"case",to:"linda.brooks88@gmail.com",title:"Missed installation — BrightNet",scenario:"Your name is Rahul Sharma. You work as a service desk analyst at BrightNet Broadband. A customer, Ms. Linda Brooks (linda.brooks88@gmail.com), is upset that her broadband installation was not completed on the promised date and is asking for compensation. The technician reached her home on time, but nobody was there to let him in, and heavy rain then delayed the second visit. Reply explaining the reasons, tell her that the company cannot offer compensation because the first visit was missed at her end, offer a new installation slot this Saturday between 10 AM and 1 PM, and ask her to confirm her phone number.",
 subjectKeys:["installation","broadband","visit","request","schedul"],subjectExample:"Your broadband installation: new slot on Saturday",
 points:[{label:"Apologize / acknowledge",any:["sorry","apolog","regret","understand"]},{label:"First visit: nobody at home",any:["nobody","no one","not available","not at home","unavailable"]},{label:"Second visit delayed by rain",any:["rain","weather"]},{label:"No compensation",any:["compensation"]},{label:"New slot: Saturday 10 AM–1 PM",any:["saturday"]},{label:"Confirm phone number",any:["phone","contact number","mobile"]}],

{id:"e18",kind:"case",to:"kevin.lewis@yahoo.com",title:"Late return request — SwiftCart",scenario:"Your name is Anjali Gupta, a customer relationship executive at SwiftCart. A customer, Mr. Kevin Lewis (kevin.lewis@yahoo.com), wants to return a mobile phone he bought 20 days ago and is demanding a full refund because the phone heats up. The return window is only 10 days. Reply explaining the return policy and that a refund is not possible, offer a free inspection at the nearest authorised service centre under warranty, and ask him to share his order number.",

{id:"e19",kind:"case",to:"olivia.martin@outlook.com",title:"Delayed app release — Nimbus",scenario:"Your name is Sameer Khan, a project coordinator at Nimbus Software. Your client, Ms. Olivia Martin (olivia.martin@outlook.com), is unhappy that the release of her mobile app has been delayed by two weeks. The delay happened partly because her team changed several requirements late in the project, and partly because your testing server crashed last week. Reply explaining both reasons politely, confirm the new release date of 15 December, and request a short call this week to finalise the remaining requirements.",

 points:[{label:"Apologize",any:["sorry","apolog","regret"]},{label:"Reason: late requirement changes",any:["requirement"]},{label:"Reason: testing server crash",any:["server","crash"]},{label:"New date: 15 December",any:["december"]},{label:"Request a call this week",any:["call","meeting","discuss"]}],
 model:"Dear Ms. Martin,\n\nI understand your concern about the two-week delay in the app release, and I apologize for the inconvenience.\n\nThere were two main reasons for the delay. Some requirements were changed late in the project, which needed extra development time. In addition, our testing server crashed last week, and we had to repeat some tests.\n\nI am pleased to confirm that the app will be released on 15 December. To avoid further delays, could we have a short call this week to finalise the remaining requirements?\n\nBest regards,\nSameer Khan\nProject Coordinator, Nimbus Software"},
{id:"e20",kind:"case",to:"arjun.das2001@gmail.com",title:"Joining kit not received — Vertex",scenario:"Your name is Neha Joshi, an HR executive at Vertex Solutions. A new employee, Mr. Arjun Das (arjun.das2001@gmail.com), has emailed that he has not yet received his joining kit and laptop. The laptop was dispatched, but it was returned because the address on his joining form had an incorrect PIN code. The joining kits were also delayed by the vendor. Reply apologising, explain both reasons, ask him to confirm his full address with the correct PIN code, and assure him that both items will be delivered within three working days after he confirms.",

{id:"e21",kind:"case",to:"priya.menon@gmail.com",title:"Refund demand for rescheduled flight",scenario:"Your name is David Wilson, a customer service executive at SkyHigh Airlines. A passenger, Ms. Priya Menon (priya.menon@gmail.com), is demanding a full refund because her flight was rescheduled by three hours. As per company policy, a refund is given only when a flight is delayed by more than four hours, but passengers can change their travel date free of charge. Reply apologising, explain the policy, offer a free date change or a meal voucher, and ask her to confirm her booking reference number.",

{id:"e22",kind:"case",to:"tom.baker2003@gmail.com",title:"Course access and refund — LearnPro",scenario:"Your name is Pooja Reddy, a support associate at LearnPro, an online course platform. A student, Mr. Tom Baker (tom.baker2003@gmail.com), says he cannot access the course videos he paid for and wants his money back. His payment was received, but his account was created with a different email address from the one he used to pay. The platform also had a server outage last weekend. Reply explaining both reasons, explain that refunds are not possible after 7 days but that you will link the course to the correct email, and ask him to confirm the email address he wants to use.",

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

 const ops=[];let i=n,j=m;
 while(i>0&&j>0){const s=near(E[i-1],P[j-1]);if(s>0&&Math.abs(dp[i][j]-(dp[i-1][j-1]+s))<1e-9){ops.push({t:s===1?'eq':'near',w:E[i-1],h:P[j-1]});i--;j--}else if(dp[i-1][j]>=dp[i][j-1]){ops.push({t:'del',w:E[i-1]});i--}else{ops.push({t:'ins',w:P[j-1]});j--}}
 while(i>0){ops.push({t:'del',w:E[--i]})}while(j>0){ops.push({t:'ins',w:P[--j]})}
 ops.reverse();

/* ---------- run engine ---------- */
async function startRun(kind,keys){
 S.run=buildRun(kind,keys);S.run.input=S.input;S.lastResults=null;
 try{
  for(const sec of S.run.sections){S.run.cur=sec.key;setTop();await runSection(sec);sec.done=true;setTop()}
  if(S.run.email){
   if(kind==='full'){await processingOne()}
   MIC.stop();S.run.cur='M';setTop();await runEmail();
   guard();
   if(kind==='full'){await processingTwo()}
  }
 }catch(e){if(e!==ABORT)console.error(e)}
 finish();
}
function sectionIndex(k){const ks=S.run.sections.map(s=>s.key);return ks.indexOf(k)+1}
async function waitOrClick(seconds,btn,onTick){return new Promise(res=>{const t0=performance.now();let done=false;const end=()=>{if(done)return;done=true;clearInterval(iv);res()};const iv=setInterval(()=>{const left=Math.max(0,seconds-(performance.now()-t0)/1000);onTick&&onTick(left);if(left<=0||(S.run&&S.run.aborted))end()},200);if(btn)btn.onclick=end})}
async function runSection(sec){
 const m=SEC[sec.key];
 main.className='wrap';
 const n=sec.items.length;
 main.innerHTML=`<section class="intro panel">
  <p class="eyebrow">Part 1 · Verbal · Section ${sec.key}${S.run.kind==='full'?' of G':''}</p>
  <h2>${m.name}</h2>
  <p class="lede">${m.instr}</p>
  <div class="example"><span class="lbl">Example</span><p>${m.ex}</p></div>
  <ul class="facts"><li><b>${n}</b> ${sec.key==='G'?'topic'+(n>1?'s':''):'item'+(n>1?'s':'')}</li><li><b>${itemTime({type:m.type})} s</b> per answer${S.run.input==='type'?' (typing)':''}</li><li>Audio plays <b>once</b></li></ul>
  <div class="cta-row"><button class="btn primary" id="go">Start section</button><span class="small muted">Starts automatically in <b class="mono" id="autoN">12</b> s</span></div>
 </section>`;
 speak(m.say);
 await waitOrClick(12,$('#go'),l=>{const a=$('#autoN');if(a)a.textContent=Math.ceil(l)});
 try{speechSynthesis.cancel()}catch(e){}
 guard();
 if(sec.groups.length){for(const g of sec.groups){await listenPassage(sec,g);for(const it of g.items)await runItem(sec,it)}}
 else for(const it of sec.items)await runItem(sec,it);
}
function itemTime(it){const base=it.type==='speech'?60:15;return S.run&&S.run.input==='type'?base*2:base}
function consoleHtml(sec,label,count){
 return `<section class="console" id="con">

function setStatus(kind,text){const c=$('#con');if(!c)return;c.classList.remove('listen','rec','idle');c.classList.add(kind);$('#statusT').textContent=text;$('#wave').hidden=kind!=='listen'}

async function runItem(sec,it){
 guard();
 const idx=sec.items.indexOf(it)+1;
 let label=`Item ${idx} of ${sec.items.length}`;
 if(it.type==='qa'){const g=sec.groups.find(x=>x.id===it.gid);label=`Question ${g.items.indexOf(it)+1} of ${g.items.length}`}
 main.innerHTML=consoleHtml(sec,label,'');
 const pt=$('#ptext');
 setStatus('listen','Listen');$('#ringN').textContent=itemTime(it);
 if(it.type==='read'){setStatus('idle','Read this sentence');pt.hidden=false;pt.textContent=it.t;await wait(1500)}
 else if(it.type==='speech'){pt.hidden=false;pt.classList.add('topic');pt.textContent=it.topic;await speak(it.prompt)}
 else if(it.type==='fill'){const [a,b]=it.t.split('___');await speak(a);guard();await tone(440,0.8,0.13);guard();if(b&&b.replace(/[.?!\s]/g,''))await speak(b)}
 else if(it.type==='qa')await speak(it.q);
 else if(it.type==='correct')await speak(it.w);
 else await speak(it.t);
 guard();
 if(it.type==='speech'){const h=$('#hint');if(h)h.textContent=TOPIC_FRAME}

const TOPIC_FRAME='Frame: one-line answer → reason + example → second reason → closing line.';
async function capture(seconds,it){
 setStatus('rec',S.run.input==='speech'?'Recording — speak now':'Type your answer');
 const practice=S.settings.mode==='practice';const skip=$('#skipBtn');
 S.skip=false;if(practice){skip.hidden=false;skip.onclick=()=>{S.skip=true}}
 let t0=performance.now();
 const tick=()=>new Promise(res=>{t0=performance.now();const iv=setInterval(()=>{const left=Math.max(0,seconds-(performance.now()-t0)/1000);setRing(left,seconds);if(left<=0||S.skip||(S.run&&S.run.aborted)){clearInterval(iv);res()}},100)});
 if(S.run.input==='speech'){
  const live=$('#live');
  if(MIC.mode()==='tap'){
   setStatus('idle','Tap the button, then speak');
   const tb=$('#tapAns');tb.hidden=false;
   await new Promise(res=>{let done=false;const go=()=>{if(done)return;done=true;clearTimeout(tm);clearInterval(ai);res()};tb.onclick=()=>{MIC.start();go()};const tm=setTimeout(go,10000);const ai=setInterval(()=>{if(S.run&&S.run.aborted)go()},200)});
   tb.hidden=true;guard();
   if(MIC.want)await MIC.waitOn(2500);
   setStatus('rec',MIC.on?'Recording — speak now':'No answer recorded');
   if(!MIC.on)seconds=Math.min(seconds,3);
  }else if(MIC.mode()==='each'){
   setStatus('idle','Starting microphone…');MIC.start();
   if(!await MIC.waitOn(1500)){setStatus('idle','Tap the button below to answer');await MIC.waitOn(30000)}
   guard();setStatus('rec','Recording — speak now');
  }else if(!MIC.want)MIC.start();
  const w=MIC.open();
  const f=()=>{const t=MIC.since(w);if(!t)return;const s=$('#status');if(s)s.classList.add('heard');if(practice&&live){live.hidden=false;live.textContent=t}};
  MIC.subs.add(f);
  await tick();
  setStatus('idle','Saving…');await wait(900);
  MIC.subs.delete(f);
  const out=MIC.close(w,seconds);
  if(MIC.mode()!=='always')await MIC.pause();
  if(out.fatal){S.run.input='type';S.input='type';MIC.stop();toast('Microphone stopped working ('+out.fatal+'). Switching to typed answers for the rest of this attempt.',8000)}
  else if(out.net){toast('Speech service lost connection. Check your internet.',6000);MIC.net=false}
  return out;
 }else{
  const tb=$('#typebox');tb.hidden=false;tb.value='';tb.focus();let fk=null;tb.oninput=()=>{if(fk===null)fk=performance.now()};
  tb.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(practice)S.skip=true}};
  await tick();
  const text=tb.value.trim();tb.oninput=null;
  return {text,typed:true,conf:null,latency:fk?(fk-t0)/1000:null,span:fk?(performance.now()-fk)/1000:0,marks:[],dur:seconds};
 }
}

/* ---------- scoring ---------- */
function verdict(s){return s>=.8?'good':s>=.55?'ok':'bad'}
function none(it){return {score:0,verdict:'bad',notes:['No answer was recorded. In the real test, silence scores zero — say something, even if you are unsure.'],silent:true}}
function scoreQA(it,r){
 const n=norm(r.text),w=words(n);if(!w.length)return none(it);
 const notes=[];let key;
 if(it.keys&&it.keys.length){let hit=0;it.keys.forEach(g=>{if(g.some(k=>hasKey(n,k)))hit++;else notes.push(`Missed the key detail from the ${it.sec==='A'?'passage':'situation'}: “${g[0]}”.`)});key=hit/it.keys.length;if(key<1)notes.push(it.sec==='A'?'Answer as the person in the passage, using its exact facts — not your own life.':'Use the facts given in the situation.')}
 else{key=it.hints.some(k=>hasKey(n,k))?1:(w.length>=4?.55:.25);if(key<1)notes.push('Your reply may not directly answer the question. Repeat the question’s key words in your answer.')}
 const comp=w.length>=4?1:w.length===3?.6:.25;
 if(comp<1)notes.push(`Only ${w.length} word${w.length>1?'s':''}. Answer in one complete sentence — e.g. “${it.model}”`);
 const score=.7*key+.3*comp;
 return {score,verdict:verdict(score),notes,comp,key};
}
function scoreText(it,r){
 const n=norm(r.text);if(!n)return none(it);
 const E=words(norm(it.t)),P=words(n);const a=align(E,P);const notes=[];
 const miss=a.ops.filter(o=>o.t==='del').map(o=>o.w),extra=a.ops.filter(o=>o.t==='ins').map(o=>o.w);

  ${m.wpm!=null?`<div><b class="mono">${m.pauses}</b><span>long pauses</span></div>`:''}
  <div><b class="mono">${m.ttr}%</b><span>word variety</span></div>
  <div><b class="mono">${m.linkers.length}</b><span>linking phrases</span></div></div>`:''}
 <div class="qgrid one"><div><span class="lbl">Transcript</span><p class="said">${it.resp.text?esc(it.resp.text):'<i class="muted">(nothing recorded)</i>'}</p>${m&&m.linkers.length?`<p class="tiny muted">Linkers used: ${m.linkers.join(', ')}</p>`:''}</div></div>
 <ul class="notes">${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
}
function emailBlock(E){
 const r=E.resp;
 return `<div class="email-rep">
  ${E.crit.length?`<div class="crit"><b>Elimination risks</b><ul>${E.crit.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`:''}
  <div class="grid2 tight">
   <div><span class="lbl">Checklist</span><ul class="checks">${E.checks.map(c=>`<li class="${c.ok?'y':'n'}">${esc(c.label)}</li>`).join('')}</ul>
    <span class="lbl">Scenario points covered (${E.pts.filter(p=>p.ok).length}/${E.pts.length})</span><ul class="checks">${E.pts.map(p=>`<li class="${p.ok?'y':'n'}">${esc(p.label)}</li>`).join('')}</ul></div>
   <div><span class="lbl">What went well</span>${E.good.length?`<ul class="notes good">${E.good.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>`:'<p class="muted small">Nothing yet — see the fixes.</p>'}
    <span class="lbl">Fix these</span>${E.issues.length?`<ul class="notes">${E.issues.map(g=>`<li>${esc(g.t)}</li>`).join('')}</ul>`:'<p class="muted small">No issues found.</p>'}</div>
  </div>
  <div class="grid2 tight">
   <div><span class="lbl">Your email</span><div class="mail"><p><b>To:</b> ${esc(r.to)||'<i class="bad-t">empty</i>'}</p><p><b>Subject:</b> ${esc(r.subject)||'<i class="bad-t">empty</i>'}</p><pre>${esc(r.body)||'(empty)'}</pre></div><p class="tiny muted">${E.wcount} words · written in ${fmt(r.used||0)}</p></div>
   <div><span class="lbl">Model email</span><div class="mail model"><p><b>To:</b> ${esc(E.e.to)}</p><p><b>Subject:</b> ${esc(E.e.subjectExample)}</p><pre>${esc(E.e.model)}</pre></div></div>
  </div>
  <details class="sub"><summary>Situation</summary><p>${esc(E.e.scenario)}</p></details>
 </div>`;
}
function priorities(R){
 const out=[];
 if(R.email&&R.email.crit.length)out.push(['Email','Fix the elimination risks: '+R.email.crit[0]]);
 if(R.silent>1)out.push(['Silence',`You gave no answer on ${R.silent} items. Always speak — even a partial answer scores.`]);
 if(R.latAvg!=null&&R.latAvg>3)out.push(['Response speed',`On average you started ${R.latAvg.toFixed(1)} s after the beep. Start within 1–2 s — the 15 s window is short.`]);
 const ks=Object.keys(R.secs).filter(k=>R.secs[k]!=null&&k!=='M').sort((a,b)=>R.secs[a]-R.secs[b]);
 ks.slice(0,3).forEach(k=>{if(R.secs[k]<80){const d=dynamicAdvice(k,R.items[k]||[],R);out.push([SEC[k].name+' ('+R.secs[k]+')',d[0]||TIPS[k][0]])}});
 if(R.confAvg!=null&&R.confAvg<.75)out.push(['Clarity',`Average recogniser clarity was ${Math.round(R.confAvg*100)}%. Slow down slightly, open your mouth more, and finish word endings.`]);
 return out.slice(0,5);
}
function renderReport(R){
 main.className='wrap wide';
 const run=R.run;const [bt,bc]=band(R.verbal);
 const E=R.email;const eb=E?(E.crit.length?['Would likely be eliminated','bad']:E.score>=75?['Strong email','good']:E.score>=60?['Acceptable — polish it','ok']:['Weak — rework structure','bad']):null;
 const pri=priorities(R);
 const secs=run.sections.map(s=>s.key);
 main.innerHTML=`
 <section class="rep-head">
  <div><p class="eyebrow">${run.kind==='full'?'Full mock':'Section drill'} · ${new Date(R.when).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'})}</p><h1>Your assessment report</h1>
  <p class="small muted">${R.typed?'Typed answers':'Spoken answers via speech recognition'} · ${run.mode==='exam'?'Exam mode':'Practice mode'}${run.aborted?' · ended early (only answered items are scored)':''}</p></div>
  <div class="cta-row"><button class="btn primary" id="again">Take another full mock</button>${(()=>{const k=Object.keys(R.secs).filter(k=>R.secs[k]!=null).sort((a,b)=>R.secs[a]-R.secs[b])[0];return k?`<button class="btn" id="weak" data-k="${k}">Drill weakest: ${SEC[k].name}</button>`:''})()}<button class="btn ghost" id="home">Home</button></div>
 </section>
 <section class="score-row">
  ${R.verbal!=null?`<div class="panel score-card"><span class="lbl">Part 1 · Verbal</span><div class="big mono">${R.verbal}<small>/100</small></div><span class="pill ${bc}">${bt}</span></div>`:''}
  ${E?`<div class="panel score-card"><span class="lbl">Part 2 · Email</span><div class="big mono">${E.score}<small>/100</small></div><span class="pill ${eb[1]}">${eb[0]}</span></div>`:''}
  <div class="panel score-card ai-card" id="aiCard"><span class="lbl">AI examiner review</span><p class="small" id="aiText">Checking…</p><div class="cta-row" id="aiBtns"></div></div>
 </section>
 ${pri.length?`<section class="panel"><h3>Fix these first</h3><ol class="prio">${pri.map(p=>`<li><b>${esc(p[0])}</b><span>${esc(p[1])}</span></li>`).join('')}</ol></section>`:''}
 <section class="grid2">
  ${R.verbal!=null?`<div class="panel"><h3>The six things the AI grades</h3><div class="params">${Object.entries(R.params).map(([k,v])=>`<div class="prm"><span>${k}</span>${bar(v)}<b class="mono">${v==null?'—':v}</b></div>`).join('')}</div><p class="tiny muted">Estimated from your answers: pronunciation from read-aloud accuracy and recogniser clarity, listening from repeat and passage answers, fluency from response speed and free-speech flow.</p></div>`:''}
  <div class="panel"><h3>Section scores</h3><div class="params">${[...secs,...(E?['M']:[])].map(k=>`<div class="prm"><span><span class="mono k">${k==='M'?'✉':k}</span> ${SEC[k].name}</span>${bar(R.secs[k])}<b class="mono">${R.secs[k]==null?'—':R.secs[k]}</b></div>`).join('')}</div><p class="tiny muted">Rough guide: 75+ comfortable, 60–74 borderline, below 60 at risk. Accenture does not publish its cut-off.</p></div>
 </section>
 <div id="aiPanel"></div>
 <section class="details">${secs.map(k=>{const list=R.items[k]||[];const dyn=dynamicAdvice(k,list,R);return `<details class="panel sec-d" ${R.secs[k]!=null&&R.secs[k]<75?'open':''}><summary><span class="mono k">${k}</span><span class="sn">${SEC[k].name}</span><span class="pill ${R.secs[k]==null?'':verdict(R.secs[k]/100)}">${R.secs[k]==null?'—':R.secs[k]}</span></summary>
   <div class="tips"><span class="lbl">How to improve</span><ul>${[...dyn,...TIPS[k]].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
   ${k==='A'||k==='B'?groupedRows(k,list):k==='G'?list.map(speechBlock).join(''):list.map((x,i)=>itemRow(k,x,i)).join('')}
   ${list.length?'':'<p class="muted">No answers recorded in this section.</p>'}
   ${(k==='C'||k==='D'||k==='F')&&list.length?'<p class="tiny muted legend"><span class="w miss">missing</span> <span class="w xtra">extra</span> <span class="w nr">close</span></p>':''}
  </details>`}).join('')}
  ${E?`<details class="panel sec-d" open><summary><span class="mono k">✉</span><span class="sn">Email Writing</span><span class="pill ${verdict(E.score/100)}">${E.score}</span></summary><div class="tips"><span class="lbl">How to improve</span><ul>${TIPS.M.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>${emailBlock(E)}</details>`:''}
 </section>`;
 $('#again').onclick=()=>gate(()=>startRun('full',['A','B','C','D','E','F','G','M']));
 $('#home').onclick=renderHome;
 const w=$('#weak');if(w)w.onclick=()=>gate(()=>startRun('drill',[w.dataset.k]));
 setupAI(R);
 window.scrollTo(0,0);
}
function groupedRows(k,list){
 const groups=[];list.forEach(x=>{let g=groups.find(y=>y.id===x.it.gid);if(!g){g={id:x.it.gid,story:x.it.story,rows:[]};groups.push(g)}g.rows.push(x)});
 let i=0;return groups.map(g=>`<div class="passage"><span class="lbl">${k==='A'?'Passage':'Situation'}</span><p>${esc(g.story)}</p></div>${g.rows.map(x=>itemRow(k,x,i++)).join('')}`).join('');
}

/* ---------- AI examiner (claude.ai only) + copyable prompt ---------- */
function reviewPrompt(R,asJson){
 const run=R.run;let s='You are a strict but fair examiner for the Accenture Communication Assessment, an AI-graded English test for fresh graduates in India (US English standard). Grade the candidate’s open-ended responses below. Spoken answers are speech-recognition transcripts: ignore missing punctuation and capitals in them, but judge grammar, word choice, relevance and completeness.\n\n';
 const ab=[...(R.items.A||[]),...(R.items.B||[])];
 if(ab.length){s+='## Short questions and conversation (rule: one complete sentence, using only facts from the passage or situation)\n';let last='';ab.forEach(x=>{if(x.it.story!==last){s+='Passage/situation: '+x.it.story+'\n';last=x.it.story}s+=`- Q: ${x.it.q}\n  Candidate: "${x.it.resp.text||'(silent)'}"\n`});s+='\n'}
 (R.items.G||[]).forEach(x=>{const m=x.s.metrics;s+=`## Free speech (1 minute)\nTopic: ${x.it.prompt}\nTranscript${m&&m.wpm?` (${m.wc} words, about ${m.wpm} words per minute)`:''}: "${x.it.resp.text||'(silent)'}"\n\n`});
 const F=(R.items.F||[]).filter(x=>!x.s.fixed);if(F.length){s+='## Error-correction items the candidate got wrong\n';F.forEach(x=>{s+=`- Wrong sentence: "${x.it.w}" | Candidate said: "${x.it.resp.text||'(silent)'}" | Correct: "${x.it.r[0]}"\n`});s+='\n'}
 if(R.email){const r=R.email.resp;s+=`## Email (15 minutes, minimum 30 words, To/Subject/Body all required)\nScenario: ${R.email.e.scenario}\nRequired To address: ${R.email.e.to}\nCandidate To: ${r.to||'(empty)'}\nCandidate Subject: ${r.subject||'(empty)'}\nCandidate Body:\n"""\n${r.body||'(empty)'}\n"""\n\n`}
 if(asJson){s+='Return ONLY a JSON object with this shape (use null for sections that are absent):\n{"speech":{"score":0-100,"summary":"2 sentences","grammar_errors":[{"said":"exact words","better":"corrected"}],"vocabulary":"1 sentence","fluency_structure":"1 sentence","tips":["..."]},"qa":[{"q":"question","score":0-100,"comment":"short, specific"}],"email":{"score":0-100,"summary":"2 sentences","errors":[{"wrote":"exact words","fix":"corrected","why":"short reason"}],"missing":["instruction not covered"],"improved_email":"full rewritten body"},"overall_tips":["3 to 5 specific, actionable tips for tomorrow"]}\nBe specific: quote the candidate’s exact words when pointing out errors. Do not invent errors.'}
 else s+='Give me: (1) a score out of 100 for each part, (2) every grammar, vocabulary and spelling mistake quoted with the correction, (3) what was missing, (4) an improved version of my email and a better one-minute answer, (5) the 5 most important things to fix before my test tomorrow.';
 return s;
}
async function getSample(){try{if(window.claude&&typeof window.claude.use==='function')return await window.claude.use('sample')}catch(e){}return null}
async function setupAI(R){
 const txt=$('#aiText'),btns=$('#aiBtns');if(!txt)return;
 const hasOpen=(R.items.G||[]).length||(R.items.A||[]).length||(R.items.B||[]).length||R.email;
 btns.innerHTML=`<button class="btn small-btn" id="copyP">Copy prompt for Claude</button>`;
 $('#copyP').onclick=async()=>{const p=reviewPrompt(R,false);try{await navigator.clipboard.writeText(p);toast('Copied. Paste it into a Claude chat for a full written review.')}catch(e){showPromptBox(p)}};
 if(!hasOpen){txt.textContent='No open-ended answers in this attempt.';return}
 txt.textContent='Paste your answers into Claude for a detailed written review of grammar, vocabulary and your email.';
 const sample=await getSample();
 if(!sample)return;
 txt.textContent='Get Claude to grade your free speech, short answers and email like the real AI examiner, with every mistake quoted and corrected.';
 const b=document.createElement('button');b.className='btn primary small-btn';b.textContent='Get AI examiner feedback';btns.prepend(b);
 b.onclick=async()=>{
  b.disabled=true;b.textContent='Grading…';txt.textContent='Claude is reading your answers. This takes about 20–40 seconds.';
  try{const data=await sample.json(reviewPrompt(R,true),{modelTier:'default'});R.ai=data;renderAI(R);txt.textContent='AI review added below.';b.remove()}
  catch(e){b.disabled=false;b.textContent='Get AI examiner feedback';txt.textContent=e&&e.code==='not_granted'?'Permission was declined. Use “Copy prompt for Claude” instead.':e&&e.code==='rate_limited'?'Rate limited — wait a minute before trying again.':'The review could not be completed ('+(e&&e.code||'error')+'). Use “Copy prompt for Claude” instead.'}
 };
}
function showPromptBox(p){const d=$('#aiPanel');d.innerHTML=`<section class="panel"><h3>Copy this prompt into Claude</h3><textarea class="prompt-box" id="pbox" readonly>${esc(p)}</textarea></section>`;const t=$('#pbox');t.focus();t.select()}
function renderAI(R){
 const a=R.ai||{};const d=$('#aiPanel');let h='<section class="panel ai-panel"><p class="eyebrow">AI examiner</p><h3>Claude’s review of your open answers</h3>';
 if(a.overall_tips&&a.overall_tips.length)h+=`<div class="tips"><span class="lbl">Before tomorrow</span><ol>${a.overall_tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`;
 if(a.speech){const s=a.speech;h+=`<div class="ai-block"><div class="qtop"><span class="qnum mono">G</span><span class="qp">Free speech</span><span class="pill ${verdict((s.score||0)/100)}">${esc(s.score)}</span></div><p>${esc(s.summary||'')}</p>${(s.grammar_errors||[]).length?`<table class="fix-t"><thead><tr><th>You said</th><th>Better</th></tr></thead><tbody>${s.grammar_errors.map(g=>`<tr><td class="bad-t">${esc(g.said)}</td><td class="good-t">${esc(g.better)}</td></tr>`).join('')}</tbody></table>`:''}<p class="small"><b>Vocabulary:</b> ${esc(s.vocabulary||'')}</p><p class="small"><b>Fluency & structure:</b> ${esc(s.fluency_structure||'')}</p>${(s.tips||[]).length?`<ul class="notes">${s.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`}
 if(a.qa&&a.qa.length)h+=`<div class="ai-block"><span class="lbl">Short questions & conversation</span>${a.qa.map(q=>`<div class="ai-q"><span class="pill ${verdict((q.score||0)/100)}">${esc(q.score)}</span><div><b>${esc(q.q)}</b><p class="small">${esc(q.comment)}</p></div></div>`).join('')}</div>`;
 if(a.email){const e=a.email;h+=`<div class="ai-block"><div class="qtop"><span class="qnum mono">✉</span><span class="qp">Email</span><span class="pill ${verdict((e.score||0)/100)}">${esc(e.score)}</span></div><p>${esc(e.summary||'')}</p>${(e.errors||[]).length?`<table class="fix-t"><thead><tr><th>You wrote</th><th>Fix</th><th>Why</th></tr></thead><tbody>${e.errors.map(g=>`<tr><td class="bad-t">${esc(g.wrote)}</td><td class="good-t">${esc(g.fix)}</td><td>${esc(g.why)}</td></tr>`).join('')}</tbody></table>`:''}${(e.missing||[]).length?`<p class="small"><b>Missing:</b> ${e.missing.map(esc).join('; ')}</p>`:''}${e.improved_email?`<span class="lbl">Improved version</span><div class="mail model"><pre>${esc(e.improved_email)}</pre></div>`:''}</div>`}
 h+='</section>';d.innerHTML=h;
}

window.__acm={norm,align,scoreQA,scoreText,scoreFill,scoreCorrect,scoreSpeech,gradeEmail};
renderHome();
